<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Universal CSE Resume Analyzer</title>
  <link rel="stylesheet" href="index.css">

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

<div class="container">
  <h1>Universal CSE Resume Analyzer</h1>
  <p>Upload PDF or paste resume text</p>

  <input type="file" id="pdfInput" accept=".pdf">

  <textarea id="resumeText" placeholder="Or paste resume text here..."></textarea>

  <select id="role">
    <option>Software Engineer</option>
    <option>Web Developer</option>
    <option>Backend Developer</option>
    <option>Data Scientist</option>
    <option>AI/ML Engineer</option>
    <option>Cyber Security</option>
    <option>Cloud Engineer</option>
    <option>DevOps Engineer</option>
  </select>

  <select id="level">
    <option value="fresher">Fresher</option>
    <option value="junior">1–3 Years</option>
    <option value="senior">3+ Years</option>
  </select>

  <button onclick="analyzeResume()">Analyze Resume</button>

  <div id="result" class="result">
    <h2 id="score"></h2>
    <h3 id="verdict"></h3>

    <h4>Matched Skills</h4>
    <div id="matched"></div>

    <h4>Missing Skills</h4>
    <div id="missing"></div>

    <h4>Suggestions</h4>
    <ul id="suggestions"></ul>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
